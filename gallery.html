<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title data-i18n="titleGallery">
      Gallery | Rehman Decoration
    </title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="logo" href="index.html">
        <img data-managed-image="brand.logo" src="images/logo.jpeg" alt="" /> Rehman Decoration
      </a>

      <button class="menu-toggle">☰</button>

      <nav class="nav">
        <a href="index.html" data-i18n="home">
          Home
        </a>

        <a href="gallery.html" data-i18n="gallery">
          Gallery
        </a>

        <a href="services.html" data-i18n="services">
          Services
        </a>

        <a href="about.html" data-i18n="about">
          About
        </a>

        <a href="tiktok.html" data-i18n="tiktok">
          TikTok
        </a>

        <a href="contact.html" data-i18n="contact">
          Contact
        </a>

        <div class="language-switch" aria-label="Language switch">
          <button class="lang-option active" type="button" data-lang="en" aria-label="English" aria-pressed="true">EN</button>
          <button class="lang-option" type="button" data-lang="ur" aria-label="اردو" aria-pressed="false">اردو</button>
          <button class="lang-option" type="button" data-lang="ps" aria-label="پښتو" aria-pressed="false">پښتو</button>
        </div>
        <select id="languageSelect" aria-label="Language" hidden>
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </nav>
    </header>

    <main>
      <section class="pagehero">
        <p
          class="eyebrow"
          data-i18n="galleryEyebrow"
        >
          REHMAN DECORATION
        </p>

        <h1 data-i18n="galleryTitle">
          Our Work
        </h1>

        <p data-i18n="galleryIntro">
          Wedding stages, Engagements, Mehndi, rooms,
          birthdays and cars.
        </p>
      </section>

      <section class="section">
        <div class="filters">
          <button
            class="filter active"
            data-filter="all"
            data-i18n="filterAll"
          >
            All
          </button>

          <button
            class="filter"
            data-filter="wedding"
            data-i18n="filterWedding"
          >
            Wedding
          </button>

          <button
            class="filter"
            data-filter="engagement"
            data-i18n="filterEngagement"
          >
            Engagement
          </button>

          <button
            class="filter"
            data-filter="mehndi"
            data-i18n="filterMehndi"
          >
            Mehndi
          </button>

          <button
            class="filter"
            data-filter="room"
            data-i18n="filterRoom"
          >
            Room
          </button>

          <button
            class="filter"
            data-filter="birthday"
            data-i18n="filterBirthday"
          >
            Birthday
          </button>

          <button
            class="filter"
            data-filter="car"
            data-i18n="filterCar"
          >
            Car
          </button>
        </div>

        <!-- Photos are added automatically with javascript -->
        <div
          class="gallerygrid"  
          id="galleryGrid"
        ></div>
      </section>
    </main>

    <footer>
      <strong>
        Rehman Decoration
      </strong>

      <p>
        0317 9980726
      </p>

      <small>
        © <span id="year"></span>
        Rehman Decoration
      </small>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/media.js"></script>
  </body>
</html>
