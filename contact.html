<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="titleContact">Contact | Rehman Decoration</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html"><img src="images/logo.jpeg" alt="" /> Rehman Decoration</a
      ><button class="menu-toggle">☰</button>
      <nav class="nav">
        <a href="index.html" data-i18n="home">Home</a><a href="gallery.html" data-i18n="gallery">Gallery</a
        ><a href="services.html" data-i18n="services">Services</a><a href="about.html" data-i18n="about">About</a
        ><a href="tiktok.html">TikTok</a><a href="contact.html" data-i18n="contact">Contact</a
        ><div class="language-switch" aria-label="Language switch">
          <button class="lang-option active" type="button" data-lang="en" aria-label="English" aria-pressed="true">EN</button>
          <button class="lang-option" type="button" data-lang="ur" aria-label="اردو" aria-pressed="false">اردو</button>
          <button class="lang-option" type="button" data-lang="ps" aria-label="پښتو" aria-pressed="false">پښتو</button>
        </div>
        <select id="languageSelect" aria-label="Language" hidden>
          <option value="en">English</option>
          <option value="ur">اردو</option>
          <option value="ps">پښتو</option>
        </select>
      </nav>
    </header>
    <main>
      <section class="pagehero">
        <p class="eyebrow" data-i18n="contactEyebrow">CONTACT</p>
        <h1 data-i18n="contactTitle">Let's plan your event.</h1>
        <p data-i18n="contactIntro">
          Fill in the details below. Your message will open in WhatsApp ready to
          send.
        </p>
      </section>
      <section class="section contactlayout">
        <form id="whatsappForm">
          <label><span data-i18n="name">Name</span><input id="name" required /></label
          ><label><span data-i18n="phone">Phone</span><input id="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="\+?[0-9\s().-]+" title="Enter a valid phone number with 7 to 15 digits." required /></label
          ><label
            ><span data-i18n="eventType">Event type</span><select id="eventType" required>
              <option value="" data-i18n="selectEvent">Select an event</option>
              <option data-i18n="filterWedding">Wedding</option>
              <option data-i18n="nikahTitle">Nikah</option>
              <option data-i18n="filterEngagement">Engagement</option>
              <option data-i18n="mehndiTitle">Mehndi</option>
              <option data-i18n="baratTitle">Barat</option>
              <option data-i18n="birthdayTitle">Birthday</option>
              <option data-i18n="roomServiceTitle">Room Decoration</option>
              <option data-i18n="carServiceTitle">Car Decoration</option>
            </select></label
          ><label><span data-i18n="eventDate">Event date</span><input id="eventDate" type="date" /></label
          ><label><span data-i18n="message">Message</span><textarea id="message" rows="6"></textarea></label
          ><button class="btn gold" type="submit" data-i18n="sendWhatsApp">Send via WhatsApp</button
          >
        </form>
        <aside class="contactcard">
          <p class="eyebrow" data-i18n="directContact">DIRECT CONTACT</p>
          <h2>Rehman Decoration</h2>
          <a href="tel:+923179980726">0317 9980726</a
          ><a href="https://wa.me/923179980726" target="_blank" rel="noopener"
            >WhatsApp</a
          ><a
            href="https://www.tiktok.com/@itx_shahid_2"
            target="_blank"
            rel="noopener"
            >TikTok @itx_shahid_2</a
          >
        </aside>
      </section>
    </main>
    <footer>
      <strong>Rehman Decoration</strong>
      <p>0317 9980726</p>
      <small>© <span id="year"></span> Rehman Decoration</small>
    </footer>
    <script src="js/script.js"></script>
  </body>
</html>
